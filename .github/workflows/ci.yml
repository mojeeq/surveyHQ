name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # SQLite is fast and needs no services. PostgreSQL is what production
          # runs, and catches faults SQLite cannot - a shared enum type emitting
          # CREATE TYPE twice, for one.
          - database: sqlite
            url: ""
          - database: postgres
            url: postgresql+psycopg2://surveyhq:surveyhq@127.0.0.1:5432/surveyhq_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: surveyhq
          POSTGRES_PASSWORD: surveyhq
          POSTGRES_DB: surveyhq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U surveyhq"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Test
        env:
          DATABASE_URL_OVERRIDE: ${{ matrix.url }}
        run: pytest tests -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  stack:
    name: Stack starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The default buildx driver is "docker", which cannot export a cache.
      # This sets up a docker-container builder, which can.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Generated the way the installer generates it, in particular the plain
      # comma-separated CORS_ORIGINS. A bare "http://host:8080" there once
      # killed the API at start-up and nginx answered 502 on everything; the
      # images still built, so building them was never enough to catch it.
      - name: Generate .env the way the installer does
        run: |
          cp .env.example .env
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=$(openssl rand -hex 32)|" .env
          sed -i "s|^ENCRYPTION_KEY=.*|ENCRYPTION_KEY=$(python3 -c 'import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())')|" .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" .env
          sed -i "s|^FIRST_ADMIN_EMAIL=.*|FIRST_ADMIN_EMAIL=ci@example.org|" .env
          sed -i "s|^FIRST_ADMIN_PASSWORD=.*|FIRST_ADMIN_PASSWORD=ci-password-12345|" .env
          sed -i "s|^PUBLIC_URL=.*|PUBLIC_URL=http://localhost:8080|" .env
          sed -i "s|^CORS_ORIGINS=.*|CORS_ORIGINS=http://localhost:8080|" .env
          docker compose config --quiet

      - name: Build and start the whole stack
        run: docker compose up -d --build

      - name: The API answers through nginx
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health | grep -q '"status":"ok"'; then
              echo "health ok"
              exit 0
            fi
            sleep 3
          done
          echo "the API never became healthy"
          exit 1

      # Proves more than a health probe: the schema was created, the bootstrap
      # administrator exists, and nginx proxies POSTs to the API.
      - name: The bootstrap administrator can sign in
        run: |
          token=$(curl -fsS -X POST http://localhost:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.org","password":"ci-password-12345"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          test -n "$token"
          curl -fsS http://localhost:8080/api/v1/datasets \
            -H "Authorization: Bearer $token" > /dev/null
          echo "signed in and read an authenticated endpoint"

      - name: The single page app is served
        run: curl -fsS http://localhost:8080/ | grep -q '<div id="root">'

      - name: The worker is running
        run: docker compose ps --services --filter status=running | grep -qx worker

      - name: Container status and logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=120

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning scripts/*.sh
