# Serves the React bundle and proxies API traffic to the backend container.

# The content policy, and why it is this short.
#
# Everything here applies to the HTML embed widget too, whether we like it or
# not: an iframe's srcdoc document inherits the policy of the page that made
# it, and so do data: and blob: frames - all three were tried in a browser and
# all three had their scripts blocked. That widget exists to render whatever
# markup a dashboard author pasted in, which the guide advertises as a logo, an
# embedded video or a link bar. So a default-src, a frame-src or an img-src
# tight enough to be worth having is also tight enough to break an embedded
# video, and the platform's own tests carry an embed holding an external
# iframe.
#
# The map has the same shape of problem from the other end: Map tiles accepts
# an arbitrary tile URL, for deployments with no route to the public hosts, so
# any fixed list of tile hosts breaks precisely the installations that most
# needed the setting.
#
# What is left is the set that restricts this document without restricting what
# it is asked to display: no injected base tag, no plugin, and no framing of
# this page by another site. Small, but true, and nothing here is load-bearing
# against XSS - escaping values before they reach a chart or map tooltip is
# what does that.
#
# A real script-src needs the embed widget served from its own response with
# its own headers, rather than from srcdoc. That is a change to the feature.
map $host $csp {
    default "base-uri 'self'; object-src 'none'; frame-ancestors 'self'";
}

# HSTS only over HTTPS.
#
# A browser ignores the header on a plain connection, so sending it always
# would be harmless but dishonest. Worse, a deployment that is deliberately
# HTTP-only on an internal network would begin advertising a policy it cannot
# keep the moment anything terminates TLS in front of it. An empty value makes
# nginx omit the header entirely.
map $http_x_forwarded_proto $hsts_header {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

upstream surveyhq_api {
    # Docker may assign a new address when the API is stopped and started.
    zone surveyhq_api 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;
    server api:8000 resolve;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API enforces MAX_UPLOAD_MB itself, and answers with the size and the
    # limit when a file is over it. nginx enforcing a second, different ceiling
    # here only turned that clear answer into a bad gateway: it had already
    # forwarded a body the API had stopped reading. One place decides.
    client_max_body_size 0;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Security headers. The content policy and the HSTS value are built by the
    # two maps at the top of this file; the comment above the first one says
    # what the policy does and does not cover.
    #
    # Permissions-Policy leaves geolocation alone. The application never asks
    # for it, but an embedded map might, and this header reaches the embed
    # widget the same way the content policy does. The rest are things neither
    # this page nor any embed anybody has described has a use for.
    # nginx note: a location block that declares its own add_header discards every
    # inherited one, so any location below that sets a header repeats these six.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security $hsts_header always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy $csp always;

    # Vite writes a content hash into every asset filename, so they never change
    # under the same URL and can be cached indefinitely.
    location /assets/ {
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security $hsts_header always;
        add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=()" always;
        add_header Content-Security-Policy $csp always;
        try_files $uri =404;
    }

    # Uploading a large export takes minutes on a field connection, and the
    # response only comes once the whole body is in, so this path gets its own
    # timeouts. The import itself no longer happens here - the API hands a large
    # upload to the worker and answers with a job - but the transfer still has
    # to survive a slow line.
    location /api/v1/datasets/upload {
        proxy_pass http://surveyhq_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://surveyhq_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Exports and Survey Solutions imports can take a while to respond.
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    location /health {
        proxy_pass http://surveyhq_api/health;
        access_log off;
    }

    # Single page app: unknown paths fall through to index.html. It must not be
    # cached, otherwise browsers keep booting a stale bundle after an upgrade.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security $hsts_header always;
        add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=()" always;
        add_header Content-Security-Policy $csp always;
        try_files $uri $uri/ /index.html;
    }
}
