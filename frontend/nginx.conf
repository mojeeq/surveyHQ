# Serves the React bundle and proxies API traffic to the backend container.

# The content policy, written once rather than repeated beside every header.
#
# What it deliberately does NOT do is restrict script-src. An iframe's srcdoc
# document inherits the policy of the page that made it, and so does a data:
# or a blob: one - all three were measured - so any script-src that blocks
# inline code also silences the HTML embed widget, whose whole purpose is to
# run markup a dashboard author pasted in. Making that widget work under a real
# script-src means serving its markup from its own response with its own
# headers, which is a feature change rather than a header change.
#
# So this is worth having for what it does do: a base tag cannot be injected, a
# plugin cannot be loaded, a form cannot post somewhere else, and the page
# cannot be framed by another site. It is not what stops a survey answer
# becoming script - escaping the chart and map tooltips is.
#
# font-src allows data: because Vite inlines any asset under its size limit as
# a data URL, and one of the bundled faces is small enough to land there. That
# is a build decision rather than a choice made here, and it showed up only by
# loading the real bundle behind this policy.
map $host $csp {
    default "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.tile.opentopomap.org https://server.arcgisonline.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self'; script-src 'self' 'unsafe-inline'";
}

# HSTS only over HTTPS.
#
# A browser ignores the header on a plain connection, so sending it always
# would be harmless but dishonest. Worse, a deployment that is deliberately
# HTTP-only on an internal network would begin advertising a policy it cannot
# keep the moment anything terminates TLS in front of it. An empty value makes
# nginx omit the header entirely.
map $http_x_forwarded_proto $hsts_header {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

upstream surveyhq_api {
    # Docker may assign a new address when the API is stopped and started.
    zone surveyhq_api 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;
    server api:8000 resolve;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API enforces MAX_UPLOAD_MB itself, and answers with the size and the
    # limit when a file is over it. nginx enforcing a second, different ceiling
    # here only turned that clear answer into a bad gateway: it had already
    # forwarded a body the API had stopped reading. One place decides.
    client_max_body_size 0;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Security headers. The content policy and the HSTS value are built by the
    # two maps at the top of this file; the comment above the first one says
    # what the policy does and does not cover.
    # nginx note: a location block that declares its own add_header discards every
    # inherited one, so any location below that sets a header repeats these six.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security $hsts_header always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy $csp always;

    # Vite writes a content hash into every asset filename, so they never change
    # under the same URL and can be cached indefinitely.
    location /assets/ {
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security $hsts_header always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy $csp always;
        try_files $uri =404;
    }

    # Uploading a large export takes minutes on a field connection, and the
    # response only comes once the whole body is in, so this path gets its own
    # timeouts. The import itself no longer happens here - the API hands a large
    # upload to the worker and answers with a job - but the transfer still has
    # to survive a slow line.
    location /api/v1/datasets/upload {
        proxy_pass http://surveyhq_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://surveyhq_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Exports and Survey Solutions imports can take a while to respond.
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    location /health {
        proxy_pass http://surveyhq_api/health;
        access_log off;
    }

    # Single page app: unknown paths fall through to index.html. It must not be
    # cached, otherwise browsers keep booting a stale bundle after an upgrade.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security $hsts_header always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy $csp always;
        try_files $uri $uri/ /index.html;
    }
}
