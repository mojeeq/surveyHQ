# Serves the React bundle and proxies API traffic to the backend container.

server {
    listen 80;
    server_name _;

    # Where the API is, looked up per request rather than once at start-up.
    #
    # nginx resolves the name in an `upstream` block exactly once, when the
    # configuration is loaded, and caches the address for the life of the
    # process. Every backend deploy recreates the api container, which comes
    # back on a different address inside the Docker network - so nginx went on
    # proxying to the address the old container had and answered 502 to
    # everything, including the sign-in call, until somebody restarted nginx
    # itself. `docker compose up -d` does not do that, because nothing about
    # the web container changed.
    #
    # 127.0.0.11 is Docker's embedded DNS server, which every container on a
    # user-defined network gets. Putting the address in a variable is what
    # moves the lookup to request time: nginx only re-resolves when the value
    # of proxy_pass is not a literal.
    #
    # The cost is the `keepalive` pool that the upstream block used to give,
    # since a variable cannot name one. For a monitoring dashboard - a handful
    # of requests per page - that is a fair trade for not going down on every
    # deploy.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream "http://api:8000";

    root /usr/share/nginx/html;
    index index.html;

    # The API enforces MAX_UPLOAD_MB itself, and answers with the size and the
    # limit when a file is over it. nginx enforcing a second, different ceiling
    # here only turned that clear answer into a bad gateway: it had already
    # forwarded a body the API had stopped reading. One place decides.
    client_max_body_size 0;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Security headers. No CSP for scripts here because the bundle is self-hosted;
    # tighten further if you place this behind your own reverse proxy.
    # nginx note: a location block that declares its own add_header discards every
    # inherited one, so any location below that sets a header repeats these three.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Vite writes a content hash into every asset filename, so they never change
    # under the same URL and can be cached indefinitely.
    location /assets/ {
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Uploading a large export takes minutes on a field connection, and the
    # response only comes once the whole body is in, so this path gets its own
    # timeouts. The import itself no longer happens here - the API hands a large
    # upload to the worker and answers with a job - but the transfer still has
    # to survive a slow line.
    location /api/v1/datasets/upload {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Exports and Survey Solutions imports can take a while to respond.
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    location /health {
        proxy_pass $api_upstream/health;
        access_log off;
    }

    # Single page app: unknown paths fall through to index.html. It must not be
    # cached, otherwise browsers keep booting a stale bundle after an upgrade.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
