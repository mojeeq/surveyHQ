# Serves the React bundle and proxies API traffic to the backend container.

upstream surveyhq_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads of survey data can be large; keep this in step with MAX_UPLOAD_MB.
    client_max_body_size 1024m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Security headers. No CSP for scripts here because the bundle is self-hosted;
    # tighten further if you place this behind your own reverse proxy.
    # nginx note: a location block that declares its own add_header discards every
    # inherited one, so any location below that sets a header repeats these three.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Vite writes a content hash into every asset filename, so they never change
    # under the same URL and can be cached indefinitely.
    location /assets/ {
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://surveyhq_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Exports and Survey Solutions imports can take a while to respond.
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    location /health {
        proxy_pass http://surveyhq_api/health;
        access_log off;
    }

    # Single page app: unknown paths fall through to index.html. It must not be
    # cached, otherwise browsers keep booting a stale bundle after an upgrade.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
