<style>
/* Any bundled font a widget on this board is set in, carried in the file as
   base64 so the board reads the same on a laptop that has never met this
   platform. Empty when the board uses none. */
/*__FONTS__*/
  :root {
    --ink-900: #1c1b19; --ink-700: #44423e; --ink-500: #6f6c66;
    --ink-400: #8d8a83; --ink-200: #e3e1dc; --ink-100: #efedea; --ink-50: #f7f6f4;
    --brand: #2f6fd0; --surface: #ffffff; --canvas: #f8fafc;
    /* The platform's defaults, for a board that set none of its own. A row is
       74px and the gutter between rows and columns is 16px, which is what
       react-grid-layout is given; span n rows then measures
       n*74 + (n-1)*16, the same arithmetic the platform does. */
    --cols: 12; --row: 74px; --gap: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--canvas); color: var(--ink-900);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  /* The page is laid out as the platform's own public page is: a column as
     wide as the platform's, the board's name across the top on the page, and
     everything the board holds on a canvas of its own underneath. Every
     measure below is the platform's, read off it in a browser - the export
     had drifted to a masthead half the height, its logo squeezed beside the
     title, over cards that started right under the tabs with no title bar,
     and the charts were the first thing anybody saw. */
  .wrap { max-width: 1500px; margin: 0 auto; padding: 24px 24px 48px; }
  header.board { margin-bottom: 24px; }
  header.board h1 {
    margin: 0; font-size: 24px; font-weight: 600; line-height: 1.15;
    letter-spacing: -0.015em;
  }
  header.board p { margin: 6px 0 0; color: var(--ink-500); font-size: 14px; }
  /* The logo beside the name, or above it when the name is centred - one
     column, as the platform stacks them. */
  header.board .brand { display: flex; align-items: center; gap: 12px; }
  header.board .brand img { height: 32px; width: auto; flex-shrink: 0; object-fit: contain; }
  /* The board itself. Its ground, when it has one, is painted here rather
     than behind the name, and its widgets sit a gutter in from its edge. */
  .canvas { padding: 16px; border-radius: 3px; }
  .canvas > .grid { padding: 16px; }
  .canvas > .group { margin: 16px; }
  .tabs {
    display: flex; flex-wrap: wrap; gap: 0 4px; margin: 0 0 16px;
    border-bottom: 1px solid var(--ink-200);
  }
  .tabs button {
    border: 0; background: none; padding: 10px 14px; margin-bottom: -1px;
    font: inherit; font-size: 14px; font-weight: 500; color: var(--ink-500);
    cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent;
  }
  .tabs button[aria-selected="true"] {
    color: var(--brand); border-bottom-color: var(--brand); font-weight: 600;
  }
  .filters {
    display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
    background: var(--surface); border: 1px solid var(--ink-200);
    border-radius: 3px; padding: 10px 12px; margin: 0 16px;
  }
  .filters label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-700); }
  .filters select {
    font: inherit; font-size: 12px; padding: 4px 6px; border-radius: 6px;
    border: 1px solid var(--ink-200); background: #fff; min-width: 150px;
  }
  .filters .clear { border: 0; background: none; color: var(--brand); font: inherit; font-size: 12px; cursor: pointer; }
  .filters input[type=date] {
    font: inherit; font-size: 12px; padding: 3px 6px; border-radius: 6px;
    border: 1px solid var(--ink-200); background: #fff;
  }
  /* Screen has the control itself; see the print rules at the foot. */
  .filters .printed { display: none; }
  /* The board's own geometry, written onto the page from its appearance so a
     widget arrives the size it was drawn. These were once fixed at 12 columns
     and 42px rows against the platform's 74px, which put every widget at just
     over half its height: a chart squeezed until its axis was cut off, and a
     table showing four of its rows and half of a fifth. */
  .grid {
    display: grid;
    grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
    grid-auto-rows: var(--row); gap: var(--gap);
  }
  /* A group is a band here: its widgets are packed within it, as the board
     packs them, but the band itself is a strip down the page rather than the
     rectangle it is on the platform. */
  .group {
    border: 1px dashed var(--ink-200); border-radius: 3px;
    padding: 10px 12px 14px; margin: 16px 0;
  }
  .group > summary {
    cursor: pointer; font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 10px;
  }
  .group[open] > summary { margin-bottom: 12px; }
  /* The platform's own card: a 12px corner, a hairline and a soft two-part
     shadow, with the title in a bar of its own over a hairline. The title bar
     is part of the widget's height on the platform, so leaving it out here
     handed every chart the 20-odd pixels it takes - a chart a size larger
     than the one on the board. */
  .card {
    background: var(--surface); border: 1px solid var(--ink-200); border-radius: 12px;
    display: flex; flex-direction: column; overflow: hidden; min-width: 0;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.035), 0 8px 24px -18px rgba(15, 23, 42, 0.28);
  }
  .card > h2 {
    margin: 0; padding: 16px; line-height: 20px; font-size: 14px; font-weight: 600;
    border-bottom: 1px solid var(--ink-200); flex-shrink: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card > .body { flex: 1; min-height: 0; padding: 16px 16px 8px; overflow: auto; }
  .card > .caption {
    padding: 8px 16px; font-size: 12px; line-height: 1.4; color: var(--ink-500);
    border-top: 1px solid var(--ink-100); flex-shrink: 0;
  }
  .frozen { padding: 8px 16px 0; font-size: 11px; color: #8a6d1f; }
  .chart { width: 100%; height: 100%; min-height: 120px; }
  table.data { border-collapse: collapse; width: 100%; font-size: 12px; }
  table.data th, table.data td { border-bottom: 1px solid var(--ink-100); padding: 5px 8px; text-align: left; }
  table.data th { background: var(--ink-50); font-weight: 600; position: sticky; top: 0; }
  table.data td.n, table.data th.n { text-align: right; font-variant-numeric: tabular-nums; }
  table.data tr.total td, table.data td.total { font-weight: 600; background: var(--ink-50); }
  .kpi { font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; }
  /* A tile holding one number is centred in its card, as it is on the
     platform. Left at the top, a tile four rows tall is a number and then a
     third of a page of nothing, which is what an exported board full of
     counters looked like. */
  .card > .body.middle { display: flex; flex-direction: column; justify-content: center; }
  /* A tile with its groups drawn under the number: the chart takes what the
     number leaves, as on the platform. Sized to the whole body it ran past
     the foot of the card, its axis out of sight. */
  .card > .body.stack { display: flex; flex-direction: column; }
  .card > .body.stack > .chart { flex: 1; height: auto; margin-top: 12px; }
  .track { height: 8px; border-radius: 999px; background: var(--ink-100); overflow: hidden; margin-top: 10px; }
  .track > div { height: 100%; border-radius: 999px; }
  /* A widget somebody painted a dark colour. Everything inside reads its ink
     from these variables, so redefining them here is the whole repair: the
     table headers, the progress track, the hairlines and the muted lines all
     follow. Without it a slate tile arrived with near-black labels on it. */
  .card.on-dark {
    --ink-900: #f4f5f7; --ink-700: #e2e5ea; --ink-500: #c2c7d1;
    --ink-400: #c2c7d1; --ink-200: rgba(255,255,255,.18);
    --ink-100: rgba(255,255,255,.14); --ink-50: rgba(255,255,255,.10);
    --surface: rgba(255,255,255,.06);
  }
  /* A data quality panel, as the platform draws it: what passed and what never
     ran as counts, then each failing check as a pane of its own that glows
     red, or one green pane when nothing failed. The panes carry their own
     colours, so they read the same on a card somebody painted dark. The list
     is given room round its edges for the glow, which a box that scrolls
     would otherwise clip, and takes it back with a negative margin. */
  .counts { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .counts span {
    font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 6px;
    background: var(--ink-100); color: var(--ink-700); border: 1px solid var(--ink-200);
  }
  .counts span.never { background: #fffbeb; color: #92400e; border-color: #fcd34d; }
  .checks {
    list-style: none; margin: -8px -12px 0; padding: 8px 12px 12px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .check { border: 1px solid; border-radius: 3px; padding: 8px 12px 8px 16px; }
  .check p { margin: 0; }
  .check .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .check .name { font-weight: 500; min-width: 0; }
  .check .why { margin-top: 2px; font-size: 0.87em; }
  .check.bad {
    background: #fef2f2; border-color: #fca5a5; color: #7f1d1d;
    box-shadow: inset 3px 0 0 #dc2626, 0 0 0 1px rgba(220, 38, 38, 0.18),
      0 0 12px 1px rgba(220, 38, 38, 0.35);
  }
  .check.bad .why { color: rgba(153, 27, 27, 0.9); }
  .check .rate {
    flex-shrink: 0; font-size: 0.8em; font-weight: 600; font-variant-numeric: tabular-nums;
    padding: 0 6px; border-radius: 6px;
    border: 1px solid #fca5a5; background: #fee2e2; color: #b91c1c;
  }
  .check.ok {
    background: #ecfdf5; border-color: rgba(110, 231, 183, 0.7); color: #064e3b;
    box-shadow: inset 3px 0 0 #059669;
  }
  .check.ok .why { color: rgba(6, 95, 70, 0.9); }
  .muted { color: var(--ink-500); font-size: 11px; margin: 6px 0 0; }
  .note { color: var(--ink-400); font-size: 11px; }
  .text { white-space: pre-wrap; font-size: 13px; color: var(--ink-700); }
  .leafmap { width: 100%; height: 100%; min-height: 180px; border-radius: 6px; }
  .embed { width: 100%; height: 100%; border: 0; }
  footer.board { margin: 10px 16px 0; color: var(--ink-400); font-size: 11px; }
  /* How this particular board is dressed: its ground, masthead, title, tabs,
     filter bar and card opacity, written server-side from the same appearance
     the platform draws it with. Last in the sheet so it wins on its own
     specificity rather than by shouting. Empty for an undressed board. */
/*__LOOK__*/
  @media (max-width: 780px) {
    .wrap { padding: 16px 12px 32px; }
    .canvas, .canvas > .grid { padding: 8px; }
    .grid { display: block; }
    .card { margin-bottom: 14px; height: 320px; }
  }
  /* On paper.
     The file is made to be attached to a report and carried into a meeting,
     and a meeting is where it gets printed. Printed as it stands, the page
     came out with its ground colour over every sheet, a row of dropdowns
     nobody can use, and cards sliced in half at the page break.

     What the ink says is kept: which filters the numbers were read under is
     part of the figure, so the controls are printed as the values they are
     set to rather than dropped. The charts are canvases and print as they are
     drawn, which is why the background colours have to be told to print. */
  /* The pinned selection under the title. Reads as a subtitle on screen and
     has to survive onto paper, where it is the only thing distinguishing one
     province's printout from another's. */
  .pinned {
    margin: 6px 0 0;
    font-weight: 600;
    letter-spacing: .01em;
  }

  @media print {
    @page { margin: 14mm; }
    body { background: #fff; }
    .wrap { max-width: none; padding: 0; }
    .canvas, .canvas > .grid { padding: 0; }
    .canvas > .group { margin: 16px 0; }
    .filters, footer.board { margin-left: 0; margin-right: 0; }
    /* Backgrounds off by default in most browsers, which would print a dark
       tile as black text on white and a chart's own fill as nothing. */
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    /* A card is a unit: half a chart at the foot of one sheet and half at the
       head of the next is worse than a shorter first sheet. */
    .card, .group { break-inside: avoid; page-break-inside: avoid; }
    .card { box-shadow: none; }
    /* Nothing on paper can be unfolded, so a folded group is opened for the
       print and closed again after it - see the beforeprint handler. The
       marker goes, because a disclosure triangle on paper is furniture for a
       thing the reader cannot do. */
    .group > summary { list-style: none; }
    .group > summary::-webkit-details-marker { display: none; }
    .tabs { display: none; }
    .filters { border: 0; padding: 0; background: none; margin-bottom: 10px; }
    .filters .clear { display: none; }
    /* The chosen value, as text. `.printed` is written beside each control on
       every render, because a <select> prints as a control and a reader
       holding the sheet has no way to see which option it was left on. */
    .filters select, .filters input[type=date] { display: none; }
    .filters .printed { display: inline; font-size: 12px; font-weight: 600; color: var(--ink-900); }
    footer.board { margin-top: 14px; }
  }
</style>

<div class="wrap" id="app"></div>
